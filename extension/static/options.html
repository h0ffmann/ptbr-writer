<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ptbr-writer</title>
<style>
:root { color-scheme: light dark; --line: #d0d0d0; --muted: #5f5f5f; --accent: #146c2e; --error: #b00020; }
@media (prefers-color-scheme: dark) { :root { --line: #4a4a4a; --muted: #a8a8a8; --accent: #3fa35f; --error: #ff6b6b; } }
body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; }
#app { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
h1 { font-size: 20px; margin: 0 0 16px; }
h2 { font-size: 15px; margin: 24px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
p { margin: 0 0 12px; }
#provider-fields, #text-fields { display: grid; gap: 10px; margin: 16px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); }
#provider-fields label, #text-fields label { display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 12px; }
select, input[type=text], input[type=password] { font: inherit; padding: 4px 6px; box-sizing: border-box; }
#provider-fields select, #provider-fields input { width: 100%; max-width: 320px; }
#never-fix { margin: 0 0 12px; padding-left: 20px; }
#never-fix li { margin: 4px 0; }
#never-fix button { margin-left: 8px; padding: 0 8px; }
button { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
#save { border-color: var(--accent); color: var(--accent); }
#status { color: var(--accent); margin-left: 8px; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); }
table + p { margin-top: 12px; }
#new-host { width: 16em; }
#never-fix-error, #site-error { color: var(--error); margin-left: 8px; }
</style></head>
<body><div id="app"></div><script src="options.js" type="module"></script></body>
</html>
