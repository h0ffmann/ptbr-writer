# app — on each pull request and push to main that touches the desktop app or what it builds from
# (the extension's pure modules, the two skills they embed, the plugin version it must equal): on
# Linux, macOS and Windows, bootstrap the pinned tools (scripts/app.sh), run the Rust gates, build
# the installers of that system, and capture the demo build's window against the fake provider (no
# key, no network). The installers and the screenshot are this run's artifacts. The android job builds
# the APK and runs the overlay in an emulator, over Messages, against the fake Claude.
name: app

on:
  pull_request:
    paths:
      - app/**
      - extension/src/**
      - extension/Cargo.toml
      - SKILL.md
      - skills/cientifico/SKILL.md
      - plugins/ptbr-writer/.claude-plugin/plugin.json
      - scripts/app.sh
      - scripts/app-capture.*
      - scripts/app-android-capture.sh
      - .github/workflows/app.yml
  push:
    branches: [main]
    paths:
      - app/**
      - extension/src/**
      - extension/Cargo.toml
      - SKILL.md
      - skills/cientifico/SKILL.md
      - plugins/ptbr-writer/.claude-plugin/plugin.json
      - scripts/app.sh
      - scripts/app-capture.*
      - scripts/app-android-capture.sh
      - .github/workflows/app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: webview libraries, Xvfb and ImageMagick (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf xvfb x11-utils imagemagick
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            app/target
            app/.tools
          key: app-${{ runner.os }}-${{ hashFiles('app/Cargo.lock', 'app/rust-toolchain.toml', 'scripts/app.sh') }}
          restore-keys: app-${{ runner.os }}-
      - run: bash scripts/app.sh bootstrap
      - run: bash scripts/app.sh test
      - run: bash scripts/app.sh build
      - run: bash scripts/app.sh screenshot
        env:
          APP_CAPTURE_WAIT: "8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ptbr-writer-app-${{ runner.os }}
          path: |
            app/target/release/bundle/
            docs/img/app/
          if-no-files-found: warn

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The emulator needs /dev/kvm, which the runner's user cannot open by default.
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/target
            app/.tools
          key: app-android-${{ hashFiles('app/Cargo.lock', 'app/rust-toolchain.toml', 'scripts/app.sh', 'app/src-tauri/gen/android/**/*.kts') }}
          restore-keys: app-android-
      - run: bash scripts/app.sh android-bootstrap
      - run: bash scripts/app.sh android-test
      - run: bash scripts/app.sh android-build
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/app.sh android-screenshot
        env:
          APP_CAPTURE_WAIT: "10"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ptbr-writer-app-Android
          path: |
            app/target/android/
            docs/img/app/android-*
          if-no-files-found: warn
