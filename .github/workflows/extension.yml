# extension — on each pull request and push to main that touches the Chrome extension or the files
# its build reads (the two skills it embeds and the plugin version it stamps), run the unit tests
# and the end-to-end test: a headless Chromium with extension/dist-test loaded, typing into a page
# and accepting a suggestion from a local fake server for each provider. No test calls a real API.
# No nix: Node comes from actions/setup-node and Chromium from Playwright.
name: extension

on:
  pull_request:
    paths:
      - extension/**
      - SKILL.md
      - skills/cientifico/SKILL.md
      - plugins/ptbr-writer/.claude-plugin/plugin.json
      - .github/workflows/extension.yml
  push:
    branches: [main]
    paths:
      - extension/**
      - SKILL.md
      - skills/cientifico/SKILL.md
      - plugins/ptbr-writer/.claude-plugin/plugin.json
      - .github/workflows/extension.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The node of the dev shell (nix/nodejs-bin.nix), the October 2026 security release (#83).
          # A bare `22` gave 22.23.3, below the 22.23.4 fix; the CVE workflow fails below 24.22.1.
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run
      - run: node build.mjs --test
      - run: npx playwright test
