# extension — on each pull request and push to main that touches the browser extension or the files
# its build reads (the two skills it embeds, the plugin version it stamps, the flake that pins its
# toolchain), run the Rust gates (fmt, clippy on the host and on wasm32, unit tests), build the test
# extension and run the end-to-end suite: a headless Chromium with extension/dist-test loaded,
# typing into a page and accepting a suggestion from a local fake server. No test calls a real API.
# Everything runs inside the flake's dev shell (rustc, wasm-bindgen, binaryen, node), so the versions
# are the ones flake.lock pins; Chromium and its system libraries come from Playwright.
name: extension

on:
  pull_request:
    paths:
      - extension/**
      - SKILL.md
      - skills/cientifico/SKILL.md
      - plugins/ptbr-writer/.claude-plugin/plugin.json
      - flake.nix
      - flake.lock
      - .github/workflows/extension.yml
  push:
    branches: [main]
    paths:
      - extension/**
      - SKILL.md
      - skills/cientifico/SKILL.md
      - plugins/ptbr-writer/.claude-plugin/plugin.json
      - flake.nix
      - flake.lock
      - .github/workflows/extension.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            extension/target
          key: extension-cargo-${{ runner.os }}-${{ hashFiles('extension/Cargo.lock', 'flake.lock') }}
          restore-keys: extension-cargo-${{ runner.os }}-
      - run: nix develop .. -c cargo fmt --all -- --check
      - run: nix develop .. -c cargo clippy --all-targets -- -D warnings
      - run: nix develop .. -c cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: nix develop .. -c cargo clippy --target wasm32-unknown-unknown --features test-build -- -D warnings
      - run: nix develop .. -c cargo test
      - run: nix develop .. -c cargo test --features test-build
      - run: nix develop .. -c cargo xtask build --test
      - run: nix develop .. -c npm ci
      # --with-deps installs Chromium's system libraries with apt (sudo), outside nix.
      - run: nix develop .. -c npx playwright install --with-deps chromium
      - run: nix develop .. -c npx playwright test
