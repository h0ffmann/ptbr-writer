# plugin — what a third party gets from the plugin.
# smoke: on a PR or push that touches what the plugin ships, install it from the checkout into an
#   empty Claude Code config (scripts/plugin-smoke.sh). No login, no tokens, under a minute.
# pdf-bench: only by hand, with pdf_bench: the .pdf toolchain's size and first-run time on a runner
#   whose Nix store is empty, the case of a person with Nix and no pandoc.
# eval: only by hand (Actions → plugin → Run workflow). Runs plugins/gramatico/evals/ against a
#   model, with and without the plugin, on ANTHROPIC_API_KEY: a key from the Console organization
#   linked to a Max plan draws on its monthly API credits. --max-cost-usd caps the run.
name: plugin

on:
  pull_request:
    paths: [SKILL.md, "skills/**", "plugins/**", ".claude-plugin/**", scripts/plugin-smoke.sh, .github/workflows/plugin.yml]
  push:
    branches: [main]
    paths: [SKILL.md, "skills/**", "plugins/**", ".claude-plugin/**", scripts/plugin-smoke.sh, .github/workflows/plugin.yml]
  workflow_dispatch:
    inputs:
      eval:
        description: "Run the eval suite (costs API credits)"
        type: boolean
        default: true
      pdf_bench:
        description: "Time the .pdf toolchain's first download on a fresh runner (scripts/pdf-bench.sh)"
        type: boolean
        default: false
      runs:
        description: "Runs per case"
        default: "1"
      max_cost_usd:
        description: "Hard cost ceiling for the eval, in USD"
        default: "2"
      case:
        description: "Case name glob (empty: all)"
        default: ""

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: 2.1.305

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The runner's own node is not pinned and its version is not in the logs (#83): pin it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - run: scripts/plugin-smoke.sh

  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.eval
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The runner's own node is not pinned and its version is not in the logs (#83): pin it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
          MAX_COST: ${{ inputs.max_cost_usd }}
          CASE: ${{ inputs.case }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::set the ANTHROPIC_API_KEY secret first"; exit 1; }
          claude plugin eval plugins/gramatico --trust-plugin --no-publish \
            --runs "$RUNS" --max-cost-usd "$MAX_COST" ${CASE:+--case "$CASE"} \
            --output-dir eval-results --report eval-results/report.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-eval
          path: eval-results/

  pdf-bench:
    if: github.event_name == 'workflow_dispatch' && inputs.pdf_bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: scripts/pdf-bench.sh | tee -a "$GITHUB_STEP_SUMMARY"
