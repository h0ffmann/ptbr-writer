[package]
name = "ptbr-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The ptbr-writer desktop app: the extension's check in a Tauri window"
default-run = "ptbr-app"

[lib]
name = "ptbr_app"
# cdylib: the Android app loads it (libptbr_app.so), from the window and from the overlay service.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fake-provider"
required-features = ["demo"]

[features]
# The screenshot build (`just app-screenshot`): the extension's apiBase honored, the settings folder
# from PTBR_APP_CONFIG_DIR, a first text from PTBR_APP_DEMO_TEXT, and the fake provider.
demo = ["ptbr-ext/test-build"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
# The check, the prompts and the suggestions: the extension's pure modules, built for the host.
ptbr-ext = { path = "../../extension" }
ptbr-app-wire = { path = "../wire" }
tauri = { version = "=2.12.3", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# rustls with ring, not aws-lc-rs: ring needs only a C compiler on each of the three systems.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt"] }

[target.'cfg(target_os = "android")'.dependencies]
# The overlay service calls the check through JNI (src/android.rs); Tauri's own jni.
jni = { version = "=0.21.1", default-features = false }
# Android has no root store reqwest's platform verifier reaches without its Kotlin half: Mozilla's
# roots, pinned with the lock.
webpki-roots = "=1.0.11"
